<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="功能优先级矩阵 v1 / v1.1 / v1.2">
  <!--
    功能优先级矩阵 · feature-matrix.svg
    用途：把 v1/v1.1/v1.2 三阶段的功能用视觉块呈现，让读者一眼看到"v1 做哪几个、v1.1 加哪几个、v1.2 留哪几个"。
    采用 MoSCoW 优先级模型（Must / Should / Could），左→右优先级递减、颜色由浓变淡：
      · v1   · Must Have   = 朱砂红（核心必做，缺则产品不成立）
      · v1.1 · Should Have = 淡金   （重要应做，缺则体验下滑）
      · v1.2 · Could Have  = 灰色   （锦上添花，缺则不影响主流）

    占位符替换说明：
    - {{PRODUCT_NAME}}                    顶部产品名 / 项目名（≤ 12 字，可选）
    - {{V1_FEAT_1_NAME}} … {{V1_FEAT_5_NAME}}        v1 必做功能名（5 个，≤ 8 字）
    - {{V1_FEAT_*_DESC}}                  v1 功能一句话说明（≤ 16 字）
    - {{V1_FEAT_*_RICE}}                  v1 功能 RICE 分数标签（如"RICE 32"或"P0"或"⭐⭐⭐⭐⭐"，≤ 8 字）
    - {{V11_FEAT_1_NAME}} … {{V11_FEAT_4_NAME}}      v1.1 应做功能名（4 个）
    - {{V11_FEAT_*_DESC}} / {{V11_FEAT_*_RICE}}      同上
    - {{V12_FEAT_1_NAME}} … {{V12_FEAT_4_NAME}}      v1.2 可做功能名（4 个）
    - {{V12_FEAT_*_DESC}} / {{V12_FEAT_*_RICE}}      同上
    - {{V1_KPI}} / {{V11_KPI}} / {{V12_KPI}}         列底 KPI 一句话（≤ 22 字，如"v1 解决 80% 用户痛点"）

    卡片视觉高度差（已固化）：
      v1 卡片：高 76 / 68 / 60 / 52 / 44（重要的大、次要的小）
      v1.1 卡片：高 68 / 60 / 52 / 44
      v1.2 卡片：高 60 / 52 / 44 / 36（最小为可选锦上添花）

    若某列功能不足建议数：
      - 删除多余 <g class="feat-card"> 块；
      - 保持列底 KPI 锚点不变；
      - 不要新增卡片把列撑到 6 个以上，否则手机/打印视图会拥挤。
  -->
  <style>
    .fm-bg { fill: #f9f5ec; }
    .fm-frame { fill: none; stroke: #b8281f; stroke-width: 1; opacity: 0.35; }
    .fm-col-sep { stroke: #1a1a1a; stroke-width: 0.8; opacity: 0.18; stroke-dasharray: 2 4; }

    /* 顶部标题 */
    .fm-title {
      font-family: "Kaiti SC", "KaiTi", serif;
      font-size: 20px;
      fill: #3A2E26;
      letter-spacing: 0.2em;
    }
    .fm-subtitle {
      font-family: "Crimson Pro", "Georgia", serif;
      font-size: 11px;
      fill: #8a8a8a;
      letter-spacing: 0.3em;
    }
    .fm-product-tag {
      font-family: "Kaiti SC", "KaiTi", serif;
      font-size: 12.5px;
      fill: #b8281f;
      letter-spacing: 0.15em;
    }

    /* 列头 */
    .fm-col-head-must {
      fill: rgba(184, 40, 31, 0.1);
      stroke: #b8281f;
      stroke-width: 1.2;
    }
    .fm-col-head-should {
      fill: rgba(184, 155, 102, 0.16);
      stroke: #b89b66;
      stroke-width: 1.2;
    }
    .fm-col-head-could {
      fill: rgba(138, 138, 138, 0.14);
      stroke: #8a8a8a;
      stroke-width: 1;
      stroke-dasharray: 4 3;
    }
    .fm-col-head-version {
      font-family: "Crimson Pro", "Georgia", serif;
      font-size: 18px;
      text-anchor: middle;
      letter-spacing: 0.18em;
      font-weight: 600;
    }
    .fm-col-head-version-must { fill: #b8281f; }
    .fm-col-head-version-should { fill: #b89b66; }
    .fm-col-head-version-could { fill: #6a6a6a; }
    .fm-col-head-label {
      font-family: "Kaiti SC", "KaiTi", serif;
      font-size: 13.5px;
      text-anchor: middle;
      letter-spacing: 0.15em;
    }
    .fm-col-head-label-must { fill: #b8281f; }
    .fm-col-head-label-should { fill: #8c7344; }
    .fm-col-head-label-could { fill: #4a4a4a; }
    .fm-col-head-moscow {
      font-family: "Crimson Pro", "Georgia", serif;
      font-size: 10px;
      text-anchor: middle;
      letter-spacing: 0.3em;
      fill: #8a8a8a;
    }

    /* 功能卡片 */
    .fm-card-must {
      fill: #fdf3f2;
      stroke: #b8281f;
      stroke-width: 1.1;
    }
    .fm-card-should {
      fill: #fcf6e9;
      stroke: #b89b66;
      stroke-width: 1;
    }
    .fm-card-could {
      fill: #f4f2ee;
      stroke: #8a8a8a;
      stroke-width: 0.9;
      stroke-dasharray: 3 2;
    }

    .fm-feat-name {
      font-family: "Kaiti SC", "KaiTi", serif;
      font-size: 13px;
      fill: #3A2E26;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .fm-feat-desc {
      font-family: "Songti SC", "宋体", serif;
      font-size: 11px;
      fill: #4a4a4a;
    }

    /* RICE 小标签 */
    .fm-rice-tag-must {
      fill: #b8281f;
      stroke: none;
    }
    .fm-rice-tag-should {
      fill: #b89b66;
      stroke: none;
    }
    .fm-rice-tag-could {
      fill: #8a8a8a;
      stroke: none;
    }
    .fm-rice-text {
      font-family: "Crimson Pro", "Georgia", serif;
      font-size: 9.5px;
      fill: #f9f5ec;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: 0.12em;
      font-weight: 600;
    }

    /* 列底 KPI */
    .fm-kpi-bar-must {
      fill: rgba(184, 40, 31, 0.06);
      stroke: #b8281f;
      stroke-width: 0.6;
    }
    .fm-kpi-bar-should {
      fill: rgba(184, 155, 102, 0.08);
      stroke: #b89b66;
      stroke-width: 0.6;
    }
    .fm-kpi-bar-could {
      fill: rgba(138, 138, 138, 0.08);
      stroke: #8a8a8a;
      stroke-width: 0.5;
    }
    .fm-kpi-text {
      font-family: "Kaiti SC", "KaiTi", serif;
      font-size: 12px;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: 0.1em;
    }
    .fm-kpi-text-must { fill: #b8281f; }
    .fm-kpi-text-should { fill: #8c7344; }
    .fm-kpi-text-could { fill: #4a4a4a; }
    .fm-kpi-label {
      font-family: "Crimson Pro", "Georgia", serif;
      font-size: 9px;
      text-anchor: middle;
      letter-spacing: 0.28em;
      fill: #8a8a8a;
    }
  </style>

  <rect class="fm-bg" x="0" y="0" width="1200" height="700"/>
  <rect class="fm-frame" x="20" y="20" width="1160" height="660"/>

  <!-- 顶部标题区 -->
  <text class="fm-title" x="40" y="56">功 能 优 先 级 矩 阵</text>
  <text class="fm-subtitle" x="40" y="76">FEATURE  PRIORITY  MATRIX  ·  MoSCoW  Model</text>
  <text class="fm-product-tag" x="1160" y="56" text-anchor="end">{{PRODUCT_NAME}}</text>

  <!-- 横分隔线 -->
  <line x1="40" y1="92" x2="1160" y2="92" stroke="#1a1a1a" stroke-width="0.6" opacity="0.2"/>

  <!-- 列之间竖向虚线分隔（2 条） -->
  <line class="fm-col-sep" x1="413" y1="105" x2="413" y2="625"/>
  <line class="fm-col-sep" x1="787" y1="105" x2="787" y2="625"/>

  <!-- ================ 列头 1 · v1 Must Have ================ -->
  <g class="col-head-v1">
    <rect class="fm-col-head-must" x="50" y="110" width="350" height="60" rx="4"/>
    <text class="fm-col-head-version fm-col-head-version-must" x="225" y="138">v1.0</text>
    <text class="fm-col-head-label fm-col-head-label-must" x="225" y="158">Must Have · 必 做</text>
    <text class="fm-col-head-moscow" x="225" y="172" style="opacity:0;">MUST</text>
  </g>

  <!-- ================ 列头 2 · v1.1 Should Have ================ -->
  <g class="col-head-v11">
    <rect class="fm-col-head-should" x="424" y="110" width="350" height="60" rx="4"/>
    <text class="fm-col-head-version fm-col-head-version-should" x="599" y="138">v1.1</text>
    <text class="fm-col-head-label fm-col-head-label-should" x="599" y="158">Should Have · 应 做</text>
  </g>

  <!-- ================ 列头 3 · v1.2 Could Have ================ -->
  <g class="col-head-v12">
    <rect class="fm-col-head-could" x="798" y="110" width="350" height="60" rx="4"/>
    <text class="fm-col-head-version fm-col-head-version-could" x="973" y="138">v1.2</text>
    <text class="fm-col-head-label fm-col-head-label-could" x="973" y="158">Could Have · 可 做</text>
  </g>

  <!-- ================ v1 列：5 张卡（高度 76→68→60→52→44，由重到轻） ================ -->
  <!-- v1 卡片 1（76高） -->
  <g class="feat-card v1-1">
    <rect class="fm-card-must" x="60" y="185" width="330" height="76" rx="4"/>
    <text class="fm-feat-name" x="74" y="206">{{V1_FEAT_1_NAME}}</text>
    <text class="fm-feat-desc" x="74" y="224">{{V1_FEAT_1_DESC}}</text>
    <text class="fm-feat-desc" x="74" y="252" style="font-size:10px;fill:#8a8a8a;">P0 · 不做产品不成立</text>
    <rect class="fm-rice-tag-must" x="318" y="194" width="62" height="16" rx="8"/>
    <text class="fm-rice-text" x="349" y="202">{{V1_FEAT_1_RICE}}</text>
  </g>

  <!-- v1 卡片 2（68高） -->
  <g class="feat-card v1-2">
    <rect class="fm-card-must" x="60" y="269" width="330" height="68" rx="4"/>
    <text class="fm-feat-name" x="74" y="290">{{V1_FEAT_2_NAME}}</text>
    <text class="fm-feat-desc" x="74" y="308">{{V1_FEAT_2_DESC}}</text>
    <rect class="fm-rice-tag-must" x="318" y="278" width="62" height="16" rx="8"/>
    <text class="fm-rice-text" x="349" y="286">{{V1_FEAT_2_RICE}}</text>
  </g>

  <!-- v1 卡片 3（60高） -->
  <g class="feat-card v1-3">
    <rect class="fm-card-must" x="60" y="345" width="330" height="60" rx="4"/>
    <text class="fm-feat-name" x="74" y="366">{{V1_FEAT_3_NAME}}</text>
    <text class="fm-feat-desc" x="74" y="384">{{V1_FEAT_3_DESC}}</text>
    <rect class="fm-rice-tag-must" x="318" y="354" width="62" height="16" rx="8"/>
    <text class="fm-rice-text" x="349" y="362">{{V1_FEAT_3_RICE}}</text>
  </g>

  <!-- v1 卡片 4（52高） -->
  <g class="feat-card v1-4">
    <rect class="fm-card-must" x="60" y="413" width="330" height="52" rx="4"/>
    <text class="fm-feat-name" x="74" y="432">{{V1_FEAT_4_NAME}}</text>
    <text class="fm-feat-desc" x="74" y="450">{{V1_FEAT_4_DESC}}</text>
    <rect class="fm-rice-tag-must" x="318" y="421" width="62" height="16" rx="8"/>
    <text class="fm-rice-text" x="349" y="429">{{V1_FEAT_4_RICE}}</text>
  </g>

  <!-- v1 卡片 5（44高） -->
  <g class="feat-card v1-5">
    <rect class="fm-card-must" x="60" y="473" width="330" height="44" rx="4"/>
    <text class="fm-feat-name" x="74" y="490" style="font-size:12px;">{{V1_FEAT_5_NAME}}</text>
    <text class="fm-feat-desc" x="74" y="506">{{V1_FEAT_5_DESC}}</text>
    <rect class="fm-rice-tag-must" x="318" y="481" width="62" height="16" rx="8"/>
    <text class="fm-rice-text" x="349" y="489">{{V1_FEAT_5_RICE}}</text>
  </g>

  <!-- ================ v1.1 列：4 张卡（68→60→52→44） ================ -->
  <g class="feat-card v11-1">
    <rect class="fm-card-should" x="434" y="185" width="330" height="68" rx="4"/>
    <text class="fm-feat-name" x="448" y="206">{{V11_FEAT_1_NAME}}</text>
    <text class="fm-feat-desc" x="448" y="224">{{V11_FEAT_1_DESC}}</text>
    <rect class="fm-rice-tag-should" x="692" y="194" width="62" height="16" rx="8"/>
    <text class="fm-rice-text" x="723" y="202">{{V11_FEAT_1_RICE}}</text>
  </g>

  <g class="feat-card v11-2">
    <rect class="fm-card-should" x="434" y="261" width="330" height="60" rx="4"/>
    <text class="fm-feat-name" x="448" y="282">{{V11_FEAT_2_NAME}}</text>
    <text class="fm-feat-desc" x="448" y="300">{{V11_FEAT_2_DESC}}</text>
    <rect class="fm-rice-tag-should" x="692" y="270" width="62" height="16" rx="8"/>
    <text class="fm-rice-text" x="723" y="278">{{V11_FEAT_2_RICE}}</text>
  </g>

  <g class="feat-card v11-3">
    <rect class="fm-card-should" x="434" y="329" width="330" height="52" rx="4"/>
    <text class="fm-feat-name" x="448" y="348">{{V11_FEAT_3_NAME}}</text>
    <text class="fm-feat-desc" x="448" y="366">{{V11_FEAT_3_DESC}}</text>
    <rect class="fm-rice-tag-should" x="692" y="337" width="62" height="16" rx="8"/>
    <text class="fm-rice-text" x="723" y="345">{{V11_FEAT_3_RICE}}</text>
  </g>

  <g class="feat-card v11-4">
    <rect class="fm-card-should" x="434" y="389" width="330" height="44" rx="4"/>
    <text class="fm-feat-name" x="448" y="406" style="font-size:12px;">{{V11_FEAT_4_NAME}}</text>
    <text class="fm-feat-desc" x="448" y="422">{{V11_FEAT_4_DESC}}</text>
    <rect class="fm-rice-tag-should" x="692" y="397" width="62" height="16" rx="8"/>
    <text class="fm-rice-text" x="723" y="405">{{V11_FEAT_4_RICE}}</text>
  </g>

  <!-- ================ v1.2 列：4 张卡（60→52→44→36，越靠后越小） ================ -->
  <g class="feat-card v12-1">
    <rect class="fm-card-could" x="808" y="185" width="330" height="60" rx="4"/>
    <text class="fm-feat-name" x="822" y="206">{{V12_FEAT_1_NAME}}</text>
    <text class="fm-feat-desc" x="822" y="224">{{V12_FEAT_1_DESC}}</text>
    <rect class="fm-rice-tag-could" x="1066" y="194" width="62" height="16" rx="8"/>
    <text class="fm-rice-text" x="1097" y="202">{{V12_FEAT_1_RICE}}</text>
  </g>

  <g class="feat-card v12-2">
    <rect class="fm-card-could" x="808" y="253" width="330" height="52" rx="4"/>
    <text class="fm-feat-name" x="822" y="272">{{V12_FEAT_2_NAME}}</text>
    <text class="fm-feat-desc" x="822" y="290">{{V12_FEAT_2_DESC}}</text>
    <rect class="fm-rice-tag-could" x="1066" y="261" width="62" height="16" rx="8"/>
    <text class="fm-rice-text" x="1097" y="269">{{V12_FEAT_2_RICE}}</text>
  </g>

  <g class="feat-card v12-3">
    <rect class="fm-card-could" x="808" y="313" width="330" height="44" rx="4"/>
    <text class="fm-feat-name" x="822" y="330" style="font-size:12px;">{{V12_FEAT_3_NAME}}</text>
    <text class="fm-feat-desc" x="822" y="346">{{V12_FEAT_3_DESC}}</text>
    <rect class="fm-rice-tag-could" x="1066" y="321" width="62" height="16" rx="8"/>
    <text class="fm-rice-text" x="1097" y="329">{{V12_FEAT_3_RICE}}</text>
  </g>

  <g class="feat-card v12-4">
    <rect class="fm-card-could" x="808" y="365" width="330" height="36" rx="4"/>
    <text class="fm-feat-name" x="822" y="381" style="font-size:11.5px;">{{V12_FEAT_4_NAME}}</text>
    <text class="fm-feat-desc" x="822" y="395" style="font-size:10.5px;">{{V12_FEAT_4_DESC}}</text>
    <rect class="fm-rice-tag-could" x="1066" y="373" width="62" height="16" rx="8"/>
    <text class="fm-rice-text" x="1097" y="381">{{V12_FEAT_4_RICE}}</text>
  </g>

  <!-- ================ 列底 KPI 条 ================ -->
  <g class="kpi-bars">
    <text class="fm-kpi-label" x="225" y="552">v1  ·  CORE  KPI</text>
    <rect class="fm-kpi-bar-must" x="60" y="560" width="330" height="44" rx="4"/>
    <text class="fm-kpi-text fm-kpi-text-must" x="225" y="583">{{V1_KPI}}</text>

    <text class="fm-kpi-label" x="599" y="552">v1.1  ·  GROWTH  KPI</text>
    <rect class="fm-kpi-bar-should" x="434" y="560" width="330" height="44" rx="4"/>
    <text class="fm-kpi-text fm-kpi-text-should" x="599" y="583">{{V11_KPI}}</text>

    <text class="fm-kpi-label" x="973" y="552">v1.2  ·  DELIGHT  KPI</text>
    <rect class="fm-kpi-bar-could" x="808" y="560" width="330" height="44" rx="4"/>
    <text class="fm-kpi-text fm-kpi-text-could" x="973" y="583">{{V12_KPI}}</text>
  </g>

  <!-- 底部签名 -->
  <text x="600" y="660" style="font-family:'Kaiti SC',serif;font-size:11px;fill:#8a8a8a;text-anchor:middle;letter-spacing:0.2em;">Feature Priority Matrix · 功能优先级矩阵</text>
</svg>
